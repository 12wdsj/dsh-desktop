<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>DSH Desktop Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    position: relative;
    width: 100%; height: 100%;
    cursor: grab;
  }
  #stage:active { cursor: grabbing; }
  #stage canvas { width: 100%; height: 100%; }

  /* 附加动作 */
  #stage.shake  { animation: shake 0.3s linear 2; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-3px); }
    75%      { transform: translateX(3px); }
  }
  #stage.float  { animation: floaty 2.5s ease-in-out infinite; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  #stage.wiggle { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25%      { transform: rotate(-4deg); }
    75%      { transform: rotate(4deg); }
  }
  #stage.tilt { transform: rotate(-8deg); }

  /* 说话气泡 */
  #speech {
    position: absolute;
    top: 0; right: -16px;
    max-width: 240px;
    padding: 9px 14px;
    background: #ffffff;
    border-radius: 14px;
    border: 2px solid #8ab8e8;
    font: 13px/1.5 "Microsoft YaHei", sans-serif;
    color: #33475c;
    display: none;
    box-shadow: 0 3px 10px rgba(30, 60, 100, 0.18);
    white-space: nowrap;
    z-index: 10;
  }
  #speech::after {
    content: '';
    position: absolute;
    bottom: -8px; left: 24px;
    width: 0; height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid #ffffff;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="pet-canvas" width="256" height="256"></canvas>
  <div id="speech"></div>
</div>

<script>
const { petMove, petOpenMain, onPetSay } = window.electronAPI

const stage = document.getElementById('stage')
const canvas = document.getElementById('pet-canvas')
const ctx = canvas.getContext('2d')
const speech = document.getElementById('speech')

// ===== 精灵状态机（对应 whale-girl 素材契约） =====
const STATES = {
  idle:         { sheet: './assets/pet/idle.png',         frames: 3, fps: 2, playback: 'blink' },
  working:      { sheet: './assets/pet/working.png',      frames: 3, fps: 3, playback: 'loop' },
  celebrate:    { sheet: './assets/pet/celebrate.png',    frames: 3, fps: 4, playback: 'loop' },
  error:        { sheet: './assets/pet/error.png',        frames: 2, fps: 8, playback: 'once',  motion: 'shake' },
  disappointed: { sheet: './assets/pet/disappointed.png', frames: 2, fps: 2, playback: 'loop' },
  joy:          { sheet: './assets/pet/joy.png',          frames: 2, fps: 5, playback: 'loop' },
  eat:          { sheet: './assets/pet/eat.png',          frames: 3, fps: 8, playback: 'loop' },
  play:         { sheet: './assets/pet/play.png',         frames: 3, fps: 4, playback: 'loop' },
  drag:         { sheet: './assets/pet/drag.png',         frames: 1, fps: 5, playback: 'loop',  motion: 'tilt' },
  walk:         { sheet: './assets/pet/walk.png',         frames: 3, fps: 6, playback: 'pingpong' },
  sleep:        { sheet: './assets/pet/sleep.png',        frames: 2, fps: 1, playback: 'loop' },
  wake:         { sheet: './assets/pet/wake.png',         frames: 2, fps: 3, playback: 'once' },
  welcome:      { sheet: './assets/pet/welcome.png',      frames: 2, fps: 3, playback: 'loop' },
  think:        { sheet: './assets/pet/think.png',        frames: 1, fps: 2, playback: 'loop',  motion: 'float' },
  wait:         { sheet: './assets/pet/wait.png',         frames: 1, fps: 2, playback: 'loop',  motion: 'wiggle' },
}

const FRAME_W = 256

let currentState = null
let stateImage = null
let frameIndex = 0
let direction = 1          // pingpong 方向
let animTimer = null
let blinkTimer = null      // idle blink 模式
let stateEndTimer = null   // once 状态结束回 idle
let returnState = 'idle'

function loadState(name) {
  const st = STATES[name]
  if (!st) return
  if (currentState === name) return
  currentState = name
  frameIndex = 0
  direction = 1

  // motion class
  stage.className = st.motion || ''

  if (!stateImage || stateImage.src !== st.sheet) {
    const img = new Image()
    img.onload = () => {
      stateImage = img
      drawFrame()
      startPlayback(st)
    }
    img.src = st.sheet
  } else {
    drawFrame()
    startPlayback(st)
  }
}

function startPlayback(st) {
  clearInterval(animTimer)
  clearInterval(blinkTimer)
  clearTimeout(stateEndTimer)

  if (st.playback === 'once') {
    // 播一遍（自动按 fps 推进），结束回 idle
    stateEndTimer = setTimeout(() => loadState('idle'), (st.frames / st.fps) * 1000)
    animTimer = setInterval(() => {
      frameIndex = Math.min(frameIndex + 1, st.frames - 1)
      drawFrame()
    }, 1000 / st.fps)
    return
  }

  if (st.playback === 'blink') {
    // idle 模式：循环前 2 帧，随机快速插播第 3 帧（眨眼）
    animTimer = setInterval(() => {
      frameIndex = (frameIndex + 1) % 2
      drawFrame()
    }, 1000 / st.fps)
    scheduleBlink(st)
    return
  }

  if (st.playback === 'pingpong') {
    animTimer = setInterval(() => {
      frameIndex += direction
      if (frameIndex >= st.frames - 1) direction = -1
      if (frameIndex <= 0) direction = 1
      drawFrame()
    }, 1000 / st.fps)
    return
  }

  // loop
  animTimer = setInterval(() => {
    frameIndex = (frameIndex + 1) % st.frames
    drawFrame()
  }, 1000 / st.fps)
}

function scheduleBlink(st) {
  blinkTimer = setTimeout(() => {
    frameIndex = 2  // 眨眼帧
    drawFrame()
    setTimeout(() => {
      frameIndex = 0
      drawFrame()
      scheduleBlink(st)
    }, 150)
  }, 2500 + Math.random() * 3000)
}

function drawFrame() {
  if (!stateImage) return
  ctx.clearRect(0, 0, 256, 256)
  ctx.drawImage(stateImage, frameIndex * FRAME_W, 0, FRAME_W, 256, 0, 0, 256, 256)
}

// ===== 临时状态工具（结束后回 idle） =====
function playTemporary(name, durationMs) {
  loadState(name)
  clearTimeout(stateEndTimer)
  stateEndTimer = setTimeout(() => loadState('idle'), durationMs)
}

// ===== 说话 =====
const QUOTES = [
  '咕噜咕噜~ 我在呢！',
  '今天也要加油哦！',
  '双击我，打开 AI 助手~',
  'PHYSMOL 又学会新东西啦！',
  '记得喝水休息哦~',
]

function showSpeech(text) {
  speech.textContent = text
  speech.style.display = 'block'
  clearTimeout(window._speechTimer)
  window._speechTimer = setTimeout(() => {
    speech.style.display = 'none'
  }, 4000)
}

// 每 45 秒随机说一句（首次 6 秒后），说话时切 joy 状态
setTimeout(() => {
  showSpeech(QUOTES[Math.floor(Math.random() * QUOTES.length)])
  playTemporary('joy', 4000)
}, 6000)
setInterval(() => {
  showSpeech(QUOTES[Math.floor(Math.random() * QUOTES.length)])
  playTemporary('joy', 4000)
}, 45000)

// ===== 空闲睡觉 =====
let sleepTimer = null
function resetSleepTimer() {
  clearTimeout(sleepTimer)
  sleepTimer = setTimeout(() => {
    if (currentState === 'idle') loadState('sleep')
  }, 60000)
}
resetSleepTimer()
setInterval(resetSleepTimer, 30000)  // 防漂移

// ===== 拖拽 =====
let dragging = false
let offsetX = 0, offsetY = 0

stage.addEventListener('mousedown', (e) => {
  dragging = true
  offsetX = e.screenX
  offsetY = e.screenY
  loadState('drag')
  resetSleepTimer()
})

window.addEventListener('mousemove', (e) => {
  if (!dragging) return
  petMove(e.screenX - offsetX, e.screenY - offsetY)
  offsetX = e.screenX
  offsetY = e.screenY
})

window.addEventListener('mouseup', () => {
  if (!dragging) return
  dragging = false
  if (currentState === 'sleep') {
    loadState('wake')  // 睡醒过渡
    setTimeout(() => loadState('idle'), 700)
  } else {
    loadState('idle')
  }
})

// ===== 单击互动 =====
stage.addEventListener('click', () => {
  if (dragging) return
  playTemporary('play', 2000)  // 玩耍
  resetSleepTimer()
})

// ===== 双击打开主窗口 =====
stage.addEventListener('dblclick', () => {
  petOpenMain()
})

// ===== 主进程消息 =====
onPetSay((text) => {
  showSpeech(text)
  playTemporary('joy', 4000)
})

// ===== 启动：welcome → idle =====
loadState('welcome')
setTimeout(() => loadState('idle'), 2200)

stage.title = 'DSH 鲸鱼娘\n单击玩耍 / 双击打开主界面 / 按住拖动'
</script>
</body>
</html>
