<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E6BB0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bellyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7BB8E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BA0D0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B7DD8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2B5EA8;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- 水花背景 -->
  <circle cx="256" cy="256" r="240" fill="url(#waterGradient)" opacity="0.3"/>
  <circle cx="256" cy="256" r="200" fill="url(#waterGradient)" opacity="0.2"/>

  <!-- 鲸鱼身体主体 -->
  <ellipse cx="256" cy="280" rx="180" ry="120" fill="url(#bodyGradient)"/>

  <!-- 鲸鱼腹部（浅色） -->
  <ellipse cx="256" cy="310" rx="140" ry="80" fill="url(#bellyGradient)"/>

  <!-- 鲸鱼尾巴 -->
  <path d="M 436 280 Q 480 240 490 200 Q 500 180 480 170 Q 460 160 440 180 Q 420 200 430 240 Z" fill="#3A7BD5"/>
  <path d="M 436 280 Q 480 320 490 360 Q 500 380 480 390 Q 460 400 440 380 Q 420 360 430 320 Z" fill="#3A7BD5"/>

  <!-- 鲸鱼鳍 -->
  <path d="M 200 250 Q 160 200 140 220 Q 120 240 150 260 Q 180 280 200 270 Z" fill="#3A7BD5"/>

  <!-- 鲸鱼眼睛 -->
  <circle cx="180" cy="260" r="25" fill="white"/>
  <circle cx="185" cy="258" r="15" fill="#1a1a2e"/>
  <circle cx="190" cy="252" r="6" fill="white"/>

  <!-- 鲸鱼嘴巴微笑 -->
  <path d="M 140 300 Q 180 330 220 320" stroke="#2E6BB0" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 鲸鱼喷水孔 -->
  <ellipse cx="220" cy="220" rx="12" ry="8" fill="#2E6BB0"/>

  <!-- 喷出的水柱 -->
  <path d="M 220 210 Q 210 180 215 150 Q 220 120 225 100" stroke="#87CEEB" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 220 210 Q 230 180 225 150 Q 220 120 215 100" stroke="#87CEEB" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- 水滴 -->
  <circle cx="210" cy="95" r="5" fill="#87CEEB" opacity="0.8"/>
  <circle cx="230" cy="90" r="4" fill="#87CEEB" opacity="0.7"/>
  <circle cx="215" cy="85" r="3" fill="#87CEEB" opacity="0.6"/>

  <!-- 腹部纹理 -->
  <path d="M 180 310 Q 256 330 330 310" stroke="#5BA0D0" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 190 325 Q 256 340 320 325" stroke="#5BA0D0" stroke-width="3" fill="none" opacity="0.4"/>
  <path d="M 200 340 Q 256 350 310 340" stroke="#5BA0D0" stroke-width="3" fill="none" opacity="0.3"/>

  <!-- 光泽效果 -->
  <ellipse cx="200" cy="240" rx="30" ry="20" fill="white" opacity="0.15" transform="rotate(-20 200 240)"/>
</svg>
